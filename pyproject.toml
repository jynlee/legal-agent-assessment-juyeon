[project]
name = "legal-agent-assessment"
version = "0.1.0"
description = "Portable baseline for the General Legal Agent assessment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.13",
]
# MZO release tooling only, so it stays out of the default sync. Install with
# `uv sync --group release` to run scripts/build_guide_records.py.
release = [
    "pypdf>=5,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_agent_assessment"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["legal_agent_assessment"]
mypy_path = "src"
